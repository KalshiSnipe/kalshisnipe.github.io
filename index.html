  body {

    color: var(--text);

    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Layout ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header-logo span { color: var(--blue); }
  .header-sub { color: var(--muted); font-size: 13px; }
  .header-right { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-paper { background: #2d1f00; color: var(--yellow); }
  .badge-live  { background: #0d2818; color: var(--green); }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 24px; }

  /* ── Stats row ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-sub   { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .green { color: var(--green); }
  .red   { color: var(--red);   }
  .blue  { color: var(--blue);  }
  .yellow { color: var(--yellow); }

  /* ── Section headings ── */
  .section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    margin-top: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Asset cards ── */
  .asset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .asset-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .asset-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .asset-icon { font-size: 20px; }
  .asset-name { font-weight: 600; font-size: 15px; }
  .asset-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
  .asset-row span:first-child { color: var(--muted); }
  .win-bar-bg { background: var(--surface2); border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden; }
  .win-bar    { background: var(--green); height: 100%; border-radius: 4px; transition: width 0.5s; }

  /* ── Feed table ── */
  .table-wrapper { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 8px 12px;
    background: var(--surface);
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .pill-yes  { background: #0d2818; color: var(--green); }
  .pill-no   { background: #2d0d0d; color: var(--red);   }
  .pill-win  { background: #0d2818; color: var(--green); }
  .pill-loss { background: #2d0d0d; color: var(--red);   }
  .pill-pending { background: var(--surface2); color: var(--muted); }
  .ticker { font-family: monospace; color: var(--muted); font-size: 11px; }
  .pnl-pos { color: var(--green); font-weight: 600; }
  .pnl-neg { color: var(--red);   font-weight: 600; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 48px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 12px 24px;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }

  /* ── Loading ── */
  .loading { text-align: center; padding: 48px; color: var(--muted); }
</style>

<script>
(function() {
  const app = document.getElementById('app');

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmt_pnl(v) {
    const cls = v >= 0 ? 'pnl-pos' : 'pnl-neg';
    const formatted = v >= 0 ? `+$${v.toFixed(2)}` : `-$${Math.abs(v).toFixed(2)}`;
    return `<span class="${cls}">${formatted}</span>`;
  }

  function fmt_date(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false});
    } catch(e) { return iso.slice(0,16); }
  }

  function win_rate_color(wr) {
    if (wr >= 0.65) return 'green';
    if (wr >= 0.50) return 'yellow';
    return 'red';
  }

  const ASSET_ICONS = {BTC: '₿', ETH: 'Ξ', SOL: '◎', XRP: '✕'};

  // ── Render ────────────────────────────────────────────────────────────────
  function render(data) {
    const {
      total_calls = 0, wins = 0, losses = 0,
      win_rate = 0, total_pnl = 0, paper_stake_per_call = 100,
      asset_stats = {}, recent_calls = [], generated_at = ''
    } = data;

    document.getElementById('updated-at').textContent = fmt_date(generated_at);

    let html = '';

    // ── Stats row ────────────────────────────────────────────────────────────
    const wr_cls = win_rate_color(win_rate);
    const pnl_cls = total_pnl >= 0 ? 'green' : 'red';
    const fmt_stat_pnl = (v) => v >= 0 ? `+$${v.toFixed(2)}` : `-$${Math.abs(v).toFixed(2)}`;

    html += `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Calls</div>
          <div class="stat-value blue">${total_calls}</div>
          <div class="stat-sub">${wins}W · ${losses}L</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Win Rate</div>
          <div class="stat-value ${wr_cls}">${(win_rate*100).toFixed(1)}%</div>
          <div class="stat-sub">${total_calls >= 50 ? '50+ calls ✓' : `${total_calls}/50 calls`}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Paper P&L</div>
          <div class="stat-value ${pnl_cls}">${fmt_stat_pnl(total_pnl)}</div>
          <div class="stat-sub">$${paper_stake_per_call}/call</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg P&L / Call</div>
          <div class="stat-value ${pnl_cls}">${total_calls ? fmt_stat_pnl(total_pnl/total_calls) : '—'}</div>
          <div class="stat-sub">paper simulation</div>
        </div>
      </div>
    `;

    // ── Asset breakdown ──────────────────────────────────────────────────────
    const assetKeys = Object.keys(asset_stats);
    if (assetKeys.length > 0) {
      html += `<div class="section-title">Asset Breakdown</div><div class="asset-grid">`;
      for (const asset of assetKeys) {
        const s = asset_stats[asset];
        const wr = s.calls > 0 ? s.wins / s.calls : 0;
        const wr_pct = (wr * 100).toFixed(1);
        const pnl = s.pnl || 0;
        const pnl_s = pnl >= 0 ? `+$${pnl.toFixed(2)}` : `-$${Math.abs(pnl).toFixed(2)}`;
        const icon = ASSET_ICONS[asset] || '📊';
        html += `
          <div class="asset-card">
            <div class="asset-header">
              <span class="asset-icon">${icon}</span>
              <span class="asset-name">${asset}</span>
            </div>
            <div class="asset-row"><span>Calls</span><span>${s.calls}</span></div>
            <div class="asset-row"><span>Win Rate</span><span class="${win_rate_color(wr)}">${wr_pct}%</span></div>
            <div class="asset-row"><span>Paper P&L</span><span class="${pnl>=0?'green':'red'}">${pnl_s}</span></div>
            <div class="win-bar-bg"><div class="win-bar" style="width:${wr_pct}%"></div></div>
          </div>
        `;
      }
      html += `</div>`;
    }

    // ── Recent calls table ────────────────────────────────────────────────────
    html += `<div class="section-title">Recent Calls</div>`;
    if (recent_calls.length === 0) {
      html += `
        <div class="empty">
          <div class="empty-icon">🎯</div>
          <div>No calls yet. The pipeline is warming up.</div>
        </div>
      `;
    } else {
      html += `
        <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Asset</th>
              <th>Market</th>
              <th>Call</th>
              <th>Price</th>
              <th>Consensus</th>
              <th>Result</th>
              <th>P&L</th>
            </tr>
          </thead>
          <tbody>
      `;
      for (const c of recent_calls) {
        const resolved = c.outcome != null;
        const won = c.won;
        const result_pill = resolved
          ? `<span class="pill pill-${won?'win':'loss'}">${won?'WIN':'LOSS'}</span>`
          : `<span class="pill pill-pending">Pending</span>`;
        const pnl_html = resolved ? fmt_pnl(c.pnl) : '<span style="color:var(--muted)">—</span>';
        const dir_pill = `<span class="pill pill-${c.called_direction?.toLowerCase()}">${c.called_direction}</span>`;
        const title_short = (c.title || c.ticker || '').length > 45
          ? (c.title || c.ticker).slice(0, 45) + '…'
          : (c.title || c.ticker || '');

        html += `
          <tr>
            <td style="white-space:nowrap;color:var(--muted)">${fmt_date(c.posted_at)}</td>
            <td><strong>${c.asset || '—'}</strong></td>
            <td>
              ${c.kalshi_url
                ? `<a href="${c.kalshi_url}" target="_blank" style="color:var(--text);text-decoration:none;" title="View on Kalshi">${title_short} 🔗</a>`
                : `<span>${title_short}</span>`}
              <div class="ticker">${c.ticker || ''}</div>
            </td>
            <td>${dir_pill}</td>
            <td>${c.mid_price_cents != null ? c.mid_price_cents + '¢' : '—'}</td>
            <td>${c.consensus != null ? c.consensus + '/9' : '—'}</td>
            <td>${result_pill}</td>
            <td>${pnl_html}</td>
          </tr>
        `;
      }
      html += `</tbody></table></div>`;
    }

    app.innerHTML = html;
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  function boot() {
    if (window._dataLoadError || typeof DASHBOARD_DATA === 'undefined') {
      app.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⏳</div>
          <div><strong>Dashboard initializing</strong></div>
          <div style="margin-top:8px;color:var(--muted)">
            No data yet. The pipeline will populate this once the first calls are made and resolved.<br>
            Run <code>python run_daily.py</code> to start the pipeline.
          </div>
        </div>
      `;
      return;
    }
    render(DASHBOARD_DATA);
  }

  // Small delay to ensure dashboard_data.js has executed
  setTimeout(boot, 100);

  // Auto-refresh every 4 minutes to match pipeline cadence
  setTimeout(() => location.reload(), 4 * 60 * 1000);
})();
</script>
</body>
</html>
